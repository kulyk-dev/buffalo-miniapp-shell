<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="preconnect" href="https://server.tail0ed03a.ts.net">
<link rel="dns-prefetch" href="https://server.tail0ed03a.ts.net">
<title>Buffalo · відео</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#0b1411;color:#ece7da;font-family:"Segoe UI",system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.c{max-width:320px}.i{font-size:44px}h1{font-size:22px;margin:12px 0 8px;color:#d8b46a}
p{color:#8fa59a;line-height:1.5;margin:0 0 20px}
button,a.b{display:inline-block;background:#d8b46a;color:#1b1507;border:0;border-radius:12px;padding:14px 26px;font-size:17px;font-weight:600;text-decoration:none}
</style></head><body>
<div class="c" id="load"><p>Завантаження…</p></div>
<div class="c" id="tech" hidden><div class="i">🔧</div><h1>Технічні роботи</h1>
<p>Не хвилюйтесь, ваші замовлення збережені. Сервіс тимчасово недоступний, спробуйте за кілька хвилин.</p>
<button onclick="check(1)">Спробувати ще</button></div>
<div class="c" id="tg" hidden><div class="i">📲</div><h1>Відкрийте в Telegram</h1>
<p>Цей сервіс працює тільки всередині Telegram. Натисніть кнопку нижче.</p>
<a class="b" id="tglink" href="https://t.me/BuffaloUngvarVideoBot/app">Відкрити в Telegram</a></div>
<script>
// Адрес основного Mini App (Tailscale Funnel на сервере клуба)
var MAIN="https://server.tail0ed03a.ts.net";
var BOT="https://t.me/BuffaloUngvarVideoBot/app";
var TG=window.Telegram&&Telegram.WebApp;
if(TG){TG.ready();TG.expand()}
function show(id){["load","tech","tg"].forEach(function(x){document.getElementById(x).hidden=(x!==id)})}
function startParam(){
  var m=(location.hash+"&"+location.search).match(/(?:tgWebAppStartParam|startapp)=([A-Za-z0-9_-]+)/);
  return m?m[1]:"";
}
function check(n){
  n=n||1;show("load");
  var c=new AbortController(),t=setTimeout(function(){c.abort()},9000);
  fetch(MAIN+"/api/ping?"+Date.now(),{cache:"no-store",signal:c.signal}).then(function(r){return r.json()}).then(function(j){
    clearTimeout(t);
    if(j&&j.ok){location.replace(MAIN+"/"+location.search+location.hash)}else fail(n)
  }).catch(function(){clearTimeout(t);fail(n)})
}
// 3 попытки (таймаут 9 с, пауза 1 с), заглушка только если все неудачны
function fail(n){if(n<3)setTimeout(function(){check(n+1)},1000);else show("tech")}
if(!TG||!TG.initData){
  var sp=startParam();
  if(sp)document.getElementById("tglink").href=BOT+"?startapp="+sp;
  show("tg");
}else location.replace(MAIN+"/"+location.search+location.hash);
</script></body></html>
